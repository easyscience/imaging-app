# This pyproject.toml file is not meant to be distributed, but is for development purposes only. Install it with 'pip install -e .'
[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'EasyImagingApp'
version = '1.0.0'
description = 'The graphical user-interface of EasyImaging'
authors = [
  {name = 'Christian Dam Vedel', email = 'christian.vedel@ess.eu'}
]
readme = 'README.md'
license = {file = 'LICENSE'}
classifiers = [
  'Development Status :: 2 - Pre-Alpha',
  'License :: OSI Approved :: BSD License',
  'Programming Language :: Python :: 3'
]
requires-python = '>=3.11'
dependencies = [
  'EasyApp @ git+https://github.com/EasyScience/EasyApp.git@Fix_wrong_application_types',
  'toml',
  'scitiff',
  'PySide6>=6.8',
  'easyscience',
]

[project.optional-dependencies]
ci = [
  'validate-pyproject[all]',
  'build',
  'wheel',
  'pyinstaller',
]

[project.urls]
homepage = 'https://github.com/EasyScience/imaging-app'

# To allow dependencies residing in git 
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ['EasyImagingApp']
#artifacts = ['*.py', '*.qml', 'qmldir']
