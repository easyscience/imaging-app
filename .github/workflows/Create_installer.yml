name: Build installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'Create_installer'

jobs:
  build_pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Build on the following 4 configurations: 
      # 1. <Windows, Release, 2022 MSVC compiler toolchain>
      # 2. <Ubuntu latest, i.e. version 22.04, Release, GCC 11 compiler toolchain>
      # 3. <MacOS 12 with x86-64 arch, Release, Clang 14 compiler toolchain>
      # 4. <MacOS 14 with arm64 arch, Release, Clang 15 compiler toolchain
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the list.
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14, macos-15-intel]

    steps:
    - name: Checkout EasyImaginApp
      uses: actions/checkout@v5
      with:
        path: imaging-app

    - name: Checkout EasyApp
      uses: actions/checkout@v5
      with:
        repository: EasyScience/EasyApp
        ref: 'Fix_wrong_application_types'
        path: EasyApp

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
          python -m pip install --upgrade pip
          pip install uv

    - name: Install dependencies
      shell: bash
      run: uv pip install -r imaging-app/pyproject.toml --extra ci --system

    - name: Downgrade pyinstaller (MacOS)
      if: runner.os == 'macOS'
      run: uv pip install 'pyinstaller<6.0' --system

    - name: Install Qt Installer Framework
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.*'
        dir: '${{GITHUB.WORKSPACE}}'
        install-deps: 'true'
        tools: 'tools_ifw'
        no-qt-binaries: 'true'

    - name: Test paths
      shell: bash
      run: |
        cd ${{env.QT_ROOT_DIR}}
        pwd
        ls -a
        cd ..
        ls -a
        cd ..
        ls -a
        pwd

    - name: Build with pyinstaller
      working-directory: imaging-app
      shell: bash
      run: |
        pyinstaller EasyImagingApp/main.py --onedir --windowed --name EasyImaging --icon EasyImagingApp/Gui/Resources/Logos/App.ico \
        --clean --noconfirm  \
        --add-data=EasyImagingApp:. --collect-all PySide6 --collect-all scitiff --collect-all easyscience --collect-all EasyApp

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with: 
        path: imaging-app/dist/EasyImaging
        name: EasyImaging-${{ matrix.os }}

    - name: Prepare creation of installer
      working-directory: imaging-app/Installer
      shell: bash
      run: |
        cp -r ../dist/EasyImaging/* packages/core/data/

    - name: Create installers
      working-directory: imaging-app/Installer
      shell: bash
      run: |
        if [ "${RUNNER_OS}" == "Windows" ]; then
          ${{env.QT_ROOT_DIR}}/../../Tools/QtInstallerFramework/4.10/bin/binarycreator.exe -c config/config.xml -p packages ${{runner.os}}-${{runner.arch}}_EasyImaging_Installer.exe
        else
          ${{env.QT_ROOT_DIR}}/../../Tools/QtInstallerFramework/4.10/bin/binarycreator -c config/config.xml -p packages ${{runner.os}}-${{runner.arch}}_EasyImaging_Installer
        fi

    - name: Upload installers
      uses: actions/upload-artifact@master
      with:
        name: EasyImaging-installer-${{runner.os}}-${{runner.arch}}
        path: imaging-app/Installer/*EasyImaging_Installer*